services:
  classfinder:
    build:
      context: .
    ports:
      - 7842:7842
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: always
    hostname: chronis
    stop_signal: SIGINT
    environment:
      - DB_PATH=sqlite:////data/db.sqlite3
      - LOG_DIR=/logs
      - BELL_DELAY_PATH=/data/bell_delay.txt