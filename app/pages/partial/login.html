<h1>Login</h1>
<form onsubmit="attemptLogin(event)" method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required><br>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required><br>
    <label for="privacyPolicy" id="privacyPolicy">Agree to our <a href="/privacy">Privacy Policy</a></label>
    <input type="checkbox" id="privacyPolicy" name="privacyPolicy" required><br>
    <button type="submit">Login</button><br>
</form>
<div>
    <!-- <button onclick="getLinkCode()">Login with another device</button> -->
    <button onclick="gotoRegister(event)">Sign up</button>
    <button onclick="window.location.href = '/resetpassword'">Reset password</button>
</div>
{% if status is not none %}
<p>{{status}}</p>
{% endif %}
{% if devmode %}
<p>Data may be randomly deleted</p>
{% endif %}
<p id="status">{{status_message}}</p>
<script>
    linkcode = null
    function attemptLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const privacyPolicy = document.getElementById('privacyPolicy').checked;

        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: username,
                password: password,
                privacyPolicy: privacyPolicy
            }),
            credentials: 'include'
        })
        .then(response => response.json())
        .then(data => {
            if (data.status == "success") {
                document.getElementById('status').innerText = 'Login successful!';
                // redirect to the cookie redirect_to if it exists, else to the dashboard
                const cookies = document.cookie.split('; ').reduce((acc, cookie) => {
                    const [name, value] = cookie.split('=');
                    acc[name] = value;
                    return acc;
                }, {});
                const redirectTo = cookies['redirect_to'] ? decodeURIComponent(cookies['redirect_to']) : '/dashboard';
                // remove only the redirect_to cookie (don't overwrite other cookies)
                var key = encodeURIComponent('redirect_to') + '=';
                // expire for default path
                document.cookie = key + '; Max-Age=0; path=/';
                // also attempt with current hostname and dotted domain (covers common domain variants)
                try {
                    var host = location.hostname;
                    document.cookie = key + '; Max-Age=0; path=/; domain=' + host;
                    if (host.indexOf('.') !== -1) {
                        document.cookie = key + '; Max-Age=0; path=/; domain=.' + host;
                    }
                } catch(e) {}
                window.location.href = redirectTo;
            } else {
                document.getElementById('status').innerText = 'Login failed: ' + data.message;
            }
        })
        .catch(error => {
            document.getElementById('status').innerText = 'An error occurred: ' + error.message;
        });
    }
    function gotoRegister(event) {
        event.preventDefault();
        if (!document.getElementById('registersection')) {
            window.location.href = '/register';
            return;
        }
        document.getElementById('loginsection').style.display = 'none';
        document.getElementById('registersection').style.display = 'block';
    }
</script>
