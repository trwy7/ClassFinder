{% extends 'timers/ntbase.html' %}
{% block head %}
    <style>
        #ntimertext {
            opacity: 0;
            animation: fadeIn 0.7s ease-in-out forwards;
            transform: translateY(-20px);
            animation-delay: 0.1s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            #ntimertext {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
{% endblock %}
