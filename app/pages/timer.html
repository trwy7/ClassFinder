<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassFinder - Timer</title>
    <link rel="stylesheet" href="/index.css">
    <style>
        #timel {
            display: flex;
            justify-content: center;
            align-items: center;
            font-variant-numeric: tabular-nums;
            line-height: 1em;
        }
        .timer-inner {
            display: flex;
            gap: 0.2em;
            align-items: center;
            font-size: inherit;
            width: 100%;
            justify-content: center;
        }
        .time-group {
            display: flex;
            gap: 0.08em;
            align-items: center;
        }
        .digit-column {
            width: 0.9ch;
            height: 1em;
            overflow: hidden;
            display: inline-flex;
            align-items: flex-start;
            justify-content: center;
            box-sizing: border-box;
        }
        .digit-strip {
            display: flex;
            flex-direction: column;
            transition: transform 400ms cubic-bezier(.22,1,.36,1);
            will-change: transform;
            transform: translateY(0);
        }
        .digit-item {
            height: 1em;
            min-height: 1em;
            line-height: 1em;
            text-align: center;
            font-variant-numeric: tabular-nums;
            user-select: none;
            font-size: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .colon {
            padding: 0 0.12em;
            align-self: center;
            font-weight: 500;
            display: inline-block;
        }
        .time-group.hours {
            overflow: hidden;
            transition: width 420ms cubic-bezier(.22,1,.36,1);
            will-change: width, opacity;
            flex: 0 0 auto;
        }
        .time-group.minutes {
            overflow: hidden;
            transition: width 420ms cubic-bezier(.22,1,.36,1);
            will-change: width, opacity;
            flex: 0 0 auto;
        }
        .colon.colon-left {
            transition: none;
        }
        .colon.colon-right {
            transition: none;
        }
        .timer-inner.tight-gap {
            gap: 0.04em;
            transition: gap 420ms cubic-bezier(.22,1,.36,1);
        }
        .time-group,
        .digit-column {
            min-width: 0;
        }
    </style>
</head>
<body style="background-size: cover;">
    <div style="background-color: black; color: white; justify-content: center; align-items: center;"></div>
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
            <div style="padding: 20px; border-radius: 20px; backdrop-filter: blur(25px); display: flex; align-items: center; flex-direction: column;" id="shadowbox">
                <div style="width: 100%; text-align: center; font-size: 1.2em;" id="time">
                    <!-- end time is generated via the script -->
                </div>
                <div style="width: 100%; text-align: center; font-size: 6em;" id="timel">
                    <!-- timer columns are generated by script -->
                </div>
                <div class="progress-container" id="progressContainer" style="display: none; width: 0vw;">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                {% if status is not none %}
                <div style="width: 100%; text-align: center; font-size: 2em;" id="status">
                    {{status}}
                </div>
                {% endif %}
                {% if period.leavingptech %}
                <div style="width: 100%; text-align: center; font-size: 1.2em;" id="nextclassalert">
                    Leave the PTECH building.
                </div>
                {% endif %}
                {% if period and period.passing and period.course %}
                <div style="width: 100%; text-align: center; font-size: 1.2em;" id="nextclassalert">
                    Get to {{period.course.name}} in room {{period.course.room}}
                </div>
                {% endif %}
                <div id="syncready" style="display:none;">Sync ready.</div>
                <div id="settings" style="display: none; flex-direction: column; align-items: center; margin-top: 20px;">
                    <label for="timersizeSlider">End time Size:</label>
                    <input type="range" id="timersizeSlider" min="0" max="5" step="0.1" value="1.2" style="width: 200px;">
                    <label for="timeWeight">End time Weight:</label>
                    <input type="range" id="timeWeight" min="100" max="900" step="20" value="400" style="width: 200px;">
                    <label for="timelSize">Timer Size:</label>
                    <input type="range" id="timelSize" min="0" max="20" step="0.1" value="6" style="width: 200px;">
                    <label for="timelWeight">Timer Weight:</label>
                    <input type="range" id="timelWeight" min="100" max="900" step="20" value="400" style="width: 200px;">
                    <label for="progressWidth">Progress Bar Width:</label>
                    <input type="range" id="progressWidth" min="5" max="99" step="1" value="33" style="width: 200px;">
                    <label for="progressHeight">Progress Bar Height:</label>
                    <input type="range" id="progressHeight" min="5" max="100" step="1" value="20" style="width: 200px;">
                    <label for="progressHide">Hide Progress Bar:</label>
                    <input type="checkbox" id="progressHide">
                    <label for="bgColor">Background Color:</label>
                    <input type="color" id="bgColor" value="#000000">
                    <label for="bgImage">Background Image URL:</label>
                    <input type="text" id="bgImage" placeholder="https://example.com/image.jpg">
                    <label for="bgBlur">Background Blur:</label>
                    <input type="range" id="bgBlur" min="0" max="50" step="1" value="0">
                    <label for="textColor">Text Color:</label>
                    <input type="color" id="textColor" value="#ffffff">
                    <label for="noredirect">Disable redirecting to dashboard:</label>
                    <input type="checkbox" id="noredirect" {% if not redirect %}checked{% endif %}>
                    <button onclick="saveSettings();">Save and reload</button>
                    <button onclick="resetSettings();">Reset to defaults</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        var nextclass = "{{nextclass}}";
        var startclass = "{{startclass}}";
        var animfinished = false;
        var targetprogress = 0;
        var updatetimerv = true;
        var current_epoch = Number("{{current_epoch}}") || Date.now();
        let offset_from_epoch = current_epoch - Date.now();
        let syncing = false;
        let bellSyncActive = false;
        let syncsuccess = false;

        (function(){
            // Builds the digit columns inside #timel
            window._digitStrips = [];
            window._digitCols = [];
            function makeColumn() {
                const col = document.createElement('div');
                col.className = 'digit-column';
                const strip = document.createElement('div');
                strip.className = 'digit-strip';
                for (let d = 0; d <= 9; d++) {
                    const item = document.createElement('div');
                    item.className = 'digit-item';
                    item.textContent = d;
                    strip.appendChild(item);
                }
                col.appendChild(strip);
                return {col, strip};
            }

            function buildDigitColumns() {
                const container = document.getElementById('timel');
                if (!container) return;
                container.innerHTML = '';
                const inner = document.createElement('div');
                inner.className = 'timer-inner';
                const hg = document.createElement('div');
                hg.className = 'time-group hours';
                for (let i = 0; i < 2; i++) {
                    const {col, strip} = makeColumn();
                    hg.appendChild(col);
                    window._digitStrips.push(strip);
                    window._digitCols.push(col);
                }
                inner.appendChild(hg);

                // colon
                const colon1 = document.createElement('div');
                colon1.className = 'colon colon-left';
                colon1.textContent = ':';
                inner.appendChild(colon1);

                // Minutes group (2 columns)
                const mg = document.createElement('div');
                mg.className = 'time-group minutes';
                for (let i = 0; i < 2; i++) {
                    const {col, strip} = makeColumn();
                    mg.appendChild(col);
                    window._digitStrips.push(strip);
                    window._digitCols.push(col);
                }
                inner.appendChild(mg);

                // colon
                const colon2 = document.createElement('div');
                colon2.className = 'colon colon-right';
                colon2.textContent = ':';
                inner.appendChild(colon2);

                // Seconds group (2 columns)
                const sg = document.createElement('div');
                sg.className = 'time-group';
                for (let i = 0; i < 2; i++) {
                    const {col, strip} = makeColumn();
                    sg.appendChild(col);
                    window._digitStrips.push(strip);
                    window._digitCols.push(col);
                }
                inner.appendChild(sg);

                container.appendChild(inner);

                // Ensure strips are positioned after layout; set initial transform to show 0
                requestAnimationFrame(() => {
                    window._digitStrips.forEach((strip) => {
                        const first = strip.firstElementChild;
                        const h = first ? first.getBoundingClientRect().height : 0;
                        strip.style.transform = 'translateY(0px)';
                        // force hardware compositing
                        strip.style.willChange = 'transform';
                    });
                });
            }

            // Update a single column to show `digit` (0-9) with smooth translateY
            function setColumnDigit(colIndex, digit) {
                const strip = window._digitStrips[colIndex];
                if (!strip) return;
                const first = strip.firstElementChild;
                // measure height via bounding rect to be robust
                const height = first ? first.getBoundingClientRect().height : parseFloat(getComputedStyle(strip).fontSize || '24');
                const translateY = -digit * height;
                // apply on next frame to ensure CSS transition works smoothly
                requestAnimationFrame(() => {
                    strip.style.transform = 'translateY(' + translateY + 'px)';
                });
            }

            // New: collapse / expand hours helpers
            window._hoursCollapsed = false;
            window._minutesCollapsed = false;
            // New: hide/show the seconds-tens column (index 4)
            function hideSecondsTens() {
                const col = window._digitCols[4];
                if (!col || col.style.display === 'none') return;
                col.style.display = 'none';
            }
            function showSecondsTens() {
                const col = window._digitCols[4];
                if (!col || col.style.display === '') return;
                col.style.display = '';
            }
            function collapseHoursAnimated() {
                const hoursGroup = document.querySelector('#timel .time-group.hours');
                const colonLeft = document.querySelector('#timel .colon.colon-left');
                const timerInner = document.querySelector('#timel .timer-inner');
                if (!hoursGroup || window._hoursCollapsed) return;
                // measure and lock current width so we can animate to 0
                const rect = hoursGroup.getBoundingClientRect();
                const w = Math.max(0, rect.width);
                hoursGroup.style.flex = '0 0 ' + w + 'px';
                hoursGroup.style.width = w + 'px';
                // force layout then animate to zero
                hoursGroup.getBoundingClientRect();
                requestAnimationFrame(() => {
                    hoursGroup.style.width = '0px';
                    hoursGroup.style.flex = '0 0 0px';
                    // don't animate opacity; hide the left colon from layout immediately
                    if (colonLeft) colonLeft.style.display = 'none';
                    if (timerInner) timerInner.classList.add('tight-gap');
                    window._hoursCollapsed = true;
                });
            }
            function expandHoursAnimated() {
                const hoursGroup = document.querySelector('#timel .time-group.hours');
                const colonLeft = document.querySelector('#timel .colon.colon-left');
                const timerInner = document.querySelector('#timel .timer-inner');
                if (!hoursGroup || !window._hoursCollapsed) return;
                // restore by clearing inline width/flex so layout returns to natural size
                hoursGroup.style.width = '';
                hoursGroup.style.flex = '';
                // no opacity manipulation required
                if (timerInner) timerInner.classList.remove('tight-gap');

                // Make the colon participate in layout again and fade it back in
                if (colonLeft) {
                    // restore the colon to layout immediately
                    colonLeft.style.display = ''; // revert to stylesheet value (inline-block)
                }

                // small timeout to allow transition from 0 -> natural
                window._hoursCollapsed = false;
            }

            // New: collapse / expand minutes helpers (hide colon between minutes and seconds)
            function collapseMinutesAnimated() {
                const minutesGroup = document.querySelector('#timel .time-group.minutes');
                const colonRight = document.querySelector('#timel .colon.colon-right');
                const timerInner = document.querySelector('#timel .timer-inner');
                if (!minutesGroup || window._minutesCollapsed) return;
                const rect = minutesGroup.getBoundingClientRect();
                const w = Math.max(0, rect.width);
                minutesGroup.style.flex = '0 0 ' + w + 'px';
                minutesGroup.style.width = w + 'px';
                minutesGroup.getBoundingClientRect();
                requestAnimationFrame(() => {
                    minutesGroup.style.width = '0px';
                    minutesGroup.style.flex = '0 0 0px';
                    // hide the right colon immediately
                    if (colonRight) colonRight.style.display = 'none';
                    if (timerInner) timerInner.classList.add('tight-gap');
                    window._minutesCollapsed = true;
                });
            }
            function expandMinutesAnimated() {
                const minutesGroup = document.querySelector('#timel .time-group.minutes');
                const colonRight = document.querySelector('#timel .colon.colon-right');
                const timerInner = document.querySelector('#timel .timer-inner');
                if (!minutesGroup || !window._minutesCollapsed) return;
                minutesGroup.style.width = '';
                minutesGroup.style.flex = '';
                if (timerInner) timerInner.classList.remove('tight-gap');
                if (colonRight) colonRight.style.display = ''; // restore
                window._minutesCollapsed = false;
            }

            // Update full HH:MM:SS display
            window.updateTimerDigits = function(h, m, s) {
                // Ensure two-digit values
                const hh = ('0' + h).slice(-2);
                const mm = ('0' + m).slice(-2);
                const ss = ('0' + s).slice(-2);
                const digits = [hh[0], hh[1], mm[0], mm[1], ss[0], ss[1]];
                for (let i = 0; i < digits.length; i++) {
                    const d = parseInt(digits[i], 10) || 0;
                    setColumnDigit(i, d);
                }
 
                // Collapse/expand hours group when hours hits 0
                const hoursNum = parseInt(h, 10) || 0;
                if (hoursNum === 0) {
                    collapseHoursAnimated();
                } else {
                    expandHoursAnimated();
                }
                // Collapse/expand minutes when less than one minute remains (hours === 0 && minutes === 0)
                const minutesNum = parseInt(m, 10) || 0;
                if (hoursNum === 0 && minutesNum === 0) {
                    collapseMinutesAnimated();
                } else {
                    expandMinutesAnimated();
                }
                // Hide the preceding 0 for seconds when there are 9 or fewer seconds left
                const secondsNum = parseInt(s, 10) || 0;
                if (secondsNum <= 9 && hoursNum === 0 && minutesNum === 0) {
                    hideSecondsTens();
                } else {
                    showSecondsTens();
                }
            };

            // Create columns right away so initial updatetimer can animate into place
            // but ensure DOM layout has a chance to compute sizes
            buildDigitColumns();
        })();

        async function syncTimeNTPish(samples = 5, delayMs = 120) {
            if (syncing) {
                console.warn("Time sync already in progress, skipping new sync.");
                return null;
            }
            syncing = true;
            console.log("Starting time sync...");
            const results = [];
            for (let i = 0; i < samples; i++) {
                const t0 = Date.now();
                try {
                    const resp = await fetch('/api/v2/server-time?_=' + t0, { cache: 'no-store' });
                    const t1 = Date.now();
                    if (!resp.ok) { await new Promise(r => setTimeout(r, delayMs)); continue; }
                    const data = await resp.json();
                    if (!data || typeof data.time !== 'number') { await new Promise(r => setTimeout(r, delayMs)); continue; }
                    const rtt = t1 - t0;
                    const serverTime = data.time;
                    // Estimate offset as serverTime - (localTimeAtRequest + rtt/2)
                    const offset = serverTime - (t0 + rtt / 2);
                    results.push({ rtt, offset, serverTime });
                } catch (e) {
                    // ignore this sample
                }
                if (i < samples - 1) {
                    await new Promise(r => setTimeout(r, delayMs));
                }
            }

            if (results.length === 0) {
                console.warn("Time sync failed, no valid samples.");
                syncing = false;
                return null;
            }

            // Use the samples with the smallest RTTs to reduce jitter influence
            results.sort((a, b) => a.rtt - b.rtt);
            const take = Math.min(3, results.length);
            const best = results.slice(0, take);
            const avgOffset = best.reduce((s, x) => s + x.offset, 0) / best.length;

            // Apply offset (rounded to ms)
            offset_from_epoch = Math.round(avgOffset);
            current_epoch = Date.now() + offset_from_epoch;

            // Log the offset and +- RTT
            console.log(`Time sync: offset=${offset_from_epoch}ms, RTT range=${Math.min(...best.map(x => x.rtt))}ms to ${Math.max(...best.map(x => x.rtt))}ms`);
            syncing = false;
            syncsuccess = true;
            return { offset_from_epoch, current_epoch, samples: results.length };
        }

        // Start background sync. Other code will use offset_from_epoch (initially 0) until sync completes.
        syncTimeNTPish().then(info => {
            if (!info) {
                console.log('time sync failed; using local clock');
            } else {
                console.log('time synced', info);
            }
        });
        if (nextclass == "nothing") {
            document.getElementById("shadowbox").remove();
        } else {
            var countDownDate = new Date(nextclass).getTime();
            var startDate = new Date(startclass).getTime();
        }
        function tick() {
            var now = new Date(Date.now() + offset_from_epoch);
            if (updatetimerv) {
                updatetimer();
            }
            setTimeout(tick, 0);
        }
        function updatetimer(first=false) {
            var now = Date.now() + offset_from_epoch;
            var distance = countDownDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // Update progress bar
            if (startDate && countDownDate) {
                var totalDuration = countDownDate - startDate;
                var elapsed = now - startDate;
                var progress = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
                targetprogress = progress;
                if (animfinished) {
                    document.getElementById("progressBar").style.width = progress + "%";
                }
            }

            // Update animated digits instead of raw innerHTML
            // Always show HH:MM:SS; leading zeros will be displayed
            if (typeof window.updateTimerDigits === 'function') {
                window.updateTimerDigits(hours, minutes, seconds);
            } else {
                // Fallback to original behaviour
                if (hours === 0 && minutes === 0) {
                    document.getElementById("timel").innerHTML = seconds;
                } else if (hours === 0) {
                    document.getElementById("timel").innerHTML = minutes + "m " + seconds + "s ";
                } else {
                    document.getElementById("timel").innerHTML = hours + "h " + minutes + "m " + seconds + "s";
                }
            }

            if (distance === 0) {
                if (first) {
                    alert("Please make sure your computer's time is correct.");
                }
                updatetimerv = false;
                if (typeof window.updateTimerDigits === 'function') {
                    window.updateTimerDigits(0,0,0);
                } else {
                    document.getElementById("timel").innerHTML = "0";
                }
                setTimeout(function() {
                    if (!bellSyncActive) {
                        location.reload();
                    }
                }, 3000);
            } else if (distance < 0) {
                document.getElementById("shadowbox").remove();
                location.reload();
            }
        }
        if (nextclass != "nothing") {
            updatetimer(first=true)
            var countDownDateObj = new Date(nextclass);
            var hours = countDownDateObj.getHours();
            var minutes = countDownDateObj.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            var strTime = hours + ':' + minutes + ' ' + ampm;
            document.getElementById("time").innerHTML = strTime;
            tick();
        }
        document.body.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
            } else if (event.code === 'KeyQ') {
                if (document.getElementById("settings").style.display === "none") {
                    document.getElementById("settings").style.display = "flex";
                } else {
                    document.getElementById("settings").style.display = "none";
                }
            } else if (event.code === 'KeyC') {
                if (!syncsuccess) {
                    alert("Time has not been synced yet, cannot show countdown.");
                    return;
                }
                if (!bellSyncActive) {
                    bellSyncActive = true;
                    document.getElementById("syncready").style.display = "block";
                    return;
                }
                // Show how long until the timer ends, in milliseconds, include negative values
                var now = Date.now() + offset_from_epoch;
                var distance = countDownDate - now;
                document.getElementById("syncready").innerText = distance + "ms, adjust the delay by " + ((distance / 1000) * -1) + "s";
                alert("Time until timer ends: " + distance + "ms");
            }
        });
        var urlParams = new URLSearchParams(window.location.search);
        var bgColor = urlParams.get('bg');
        if (bgColor) {
            document.body.style.backgroundColor = "#"+bgColor;
        }
        var bgImage = urlParams.get('bgimage');
        if (bgImage) {
            document.body.style.backgroundImage = "url('"+bgImage+"')";
            document.getElementById("shadowbox").style.boxShadow = "0px 0px 20px black";
        }
        var bgBlur = urlParams.get('bgblur');
        if (bgBlur) {
            if (nextclass != "nothing") {
                document.body.style.backdropFilter = "blur("+bgBlur+"px)";
            }
        }
        var textColor = urlParams.get('color');
        if (textColor) {
            document.body.style.color = "#"+textColor;
        }
        var timeSize = urlParams.get('timesize');
        if (timeSize) {
            document.getElementById("time").style.fontSize = timeSize;
        }

        var timerSize = urlParams.get('timersize');
        if (timerSize) {
            document.getElementById("timel").style.fontSize = timerSize;
        }

        var hideProgress = urlParams.get('hideprogress');
        if (hideProgress === 'true') {
            document.getElementById("progressContainer").style.display = "none";
        } else {
            document.getElementById("progressContainer").style.display = "flex";
        }
        var progressWidth = urlParams.get('progresswidth');
        let finalwidth;
        if (progressWidth) {
            finalwidth = progressWidth;
        } else {
            finalwidth = "33vw";
        }
        

        document.getElementById("timersizeSlider").addEventListener('input', function() {
            var size = this.value + 'em';
            document.getElementById('time').style.fontSize = size;
        });
        document.getElementById("timelSize").addEventListener('input', function() {
            var size = this.value + 'em';
            document.getElementById('timel').style.fontSize = size;
        });
        document.getElementById("progressWidth").addEventListener('input', function() {
            var width = this.value + 'vw';
            document.getElementById('progressContainer').style.width = width;
        });
        document.getElementById("progressHide").addEventListener('change', function() {
            if (this.checked) {
                document.getElementById("progressContainer").style.display = "none";
            } else {
                document.getElementById("progressContainer").style.display = "flex";
            }
        });
        document.getElementById("bgColor").addEventListener('input', function() {
            document.body.style.backgroundColor = this.value;
        });
        document.getElementById("bgImage").addEventListener('input', function() {
            document.body.style.backgroundImage = "url('"+this.value+"')";
            document.getElementById("shadowbox").style.boxShadow = "0px 0px 20px black";
        });
        document.getElementById("bgBlur").addEventListener('input', function() {
            document.body.style.backdropFilter = "blur("+this.value+"px)";
        });
        document.getElementById("textColor").addEventListener('input', function() {
            document.body.style.color = this.value;
        });
        document.getElementById("timelWeight").addEventListener('input', function() {
            var weight = this.value;
            document.getElementById('timel').style.fontWeight = weight;
        });
        document.getElementById("timeWeight").addEventListener('input', function() {
            var weight = this.value;
            document.getElementById('time').style.fontWeight = weight;
        });
        document.getElementById("progressHeight").addEventListener('input', function() {
            var height = this.value + 'px';
            document.getElementById('progressBar').style.height = height;
        });

        function saveSettings() {
            var bgColor = document.getElementById("bgColor").value.replace("#", "");
            var bgImage = document.getElementById("bgImage").value;
            var bgBlur = document.getElementById("bgBlur").value;
            var textColor = document.getElementById("textColor").value.replace("#", "");
            var timeSize = document.getElementById("timersizeSlider").value + "em";
            var timerSize = document.getElementById("timelSize").value + "em";
            var hideProgress = document.getElementById("progressHide").checked;
            var progressWidth = document.getElementById("progressWidth").value + "vw";
            var timeWeight = document.getElementById("timeWeight").value;
            var timerWeight = document.getElementById("timelWeight").value;
            var progressHeight = document.getElementById("progressHeight").value + "px";
            var redirect = document.getElementById("noredirect").checked ? "false" : "true";

            window.location.href = `?bg=${bgColor}&bgimage=${encodeURIComponent(bgImage)}&bgblur=${bgBlur}&color=${textColor}&timesize=${timeSize}&timersize=${timerSize}&hideprogress=${hideProgress}&progresswidth=${progressWidth}&timeweight=${timeWeight}&timerweight=${timerWeight}&progressheight=${progressHeight}` + (redirect === "true" ? "" : "&noredirect");
        }

        function resetSettings() {
            // Remove all URL parameters and reload
            window.history.replaceState({}, document.title, window.location.pathname);
            window.location.reload();
        }

        function loadCurrentSettings() {
            // Load values from URL parameters or use defaults
            var urlParams = new URLSearchParams(window.location.search);
            
            // Time size (default 1.2em)
            var timeSize = urlParams.get('timesize');
            if (timeSize) {
                document.getElementById("timersizeSlider").value = parseFloat(timeSize.replace('em', ''));
            }
            
            // Timer size (default 6em)
            var timerSize = urlParams.get('timersize');
            if (timerSize) {
                document.getElementById("timelSize").value = parseFloat(timerSize.replace('em', ''));
            }
            
            // Progress width (default 33vw)
            var progressWidth = urlParams.get('progresswidth');
            if (progressWidth) {
                document.getElementById("progressWidth").value = parseFloat(progressWidth.replace('vw', ''));
            }
            
            // Hide progress (default false)
            var hideProgress = urlParams.get('hideprogress');
            document.getElementById("progressHide").checked = hideProgress === 'true';
            
            // Background color - get from computed style or URL param
            var bgColor = urlParams.get('bg');
            if (bgColor) {
                document.getElementById("bgColor").value = "#" + bgColor;
            } else {
                var computedBgColor = getComputedStyle(document.body).backgroundColor;
                if (computedBgColor && computedBgColor !== 'rgba(0, 0, 0, 0)') {
                    document.getElementById("bgColor").value = rgbToHex(computedBgColor);
                }
            }
            
            // Background image
            var bgImage = urlParams.get('bgimage');
            if (bgImage) {
                document.getElementById("bgImage").value = bgImage;
            }
            
            // Background blur (default 0)
            var bgBlur = urlParams.get('bgblur');
            if (bgBlur) {
                document.getElementById("bgBlur").value = bgBlur;
            }
            
            // Text color - get from computed style or URL param
            var textColor = urlParams.get('color');
            if (textColor) {
                document.getElementById("textColor").value = "#" + textColor;
            } else {
                var computedTextColor = getComputedStyle(document.getElementById("timel")).color;
                if (computedTextColor) {
                    document.getElementById("textColor").value = rgbToHex(computedTextColor);
                }
            }

            // Time weight (default 400)
            var timeWeight = urlParams.get('timeweight');
            if (timeWeight) {
                document.getElementById("timeWeight").value = timeWeight;
                document.getElementById("time").style.fontWeight = timeWeight;
            } else {
                document.getElementById("timeWeight").value = 400; // default weight
                document.getElementById("time").style.fontWeight = 400;
            }
            var timerWeight = urlParams.get('timerweight');
            if (timerWeight) {
                document.getElementById("timelWeight").value = timerWeight;
                document.getElementById("timel").style.fontWeight = timerWeight;
            } else {
                document.getElementById("timelWeight").value = 400; // default weight
                document.getElementById("timel").style.fontWeight = 400;
            }

            var progressHeight = urlParams.get('progressheight');
            if (progressHeight) {
                document.getElementById("progressHeight").value = parseInt(progressHeight.replace('px', ''));
                document.getElementById("progressBar").style.height = progressHeight;
            } else {
                document.getElementById("progressHeight").value = 20; // default height
                document.getElementById("progressBar").style.height = "20px";
            }
        }
        
        // Helper function to convert RGB to Hex
        function rgbToHex(rgb) {
            var result = rgb.match(/\d+/g);
            if (result && result.length >= 3) {
                return "#" + ((1 << 24) + (parseInt(result[0]) << 16) + (parseInt(result[1]) << 8) + parseInt(result[2])).toString(16).slice(1);
            }
            return "#000000"; // fallback
        }

        // Animate the progress bar container width, sadly copilot as I did not know how to do an ease animation, and could not figure it out
        let animationStart = null;
        const containerDuration = 800; // milliseconds
        
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }
        
        function animateContainerWidth(timestamp) {
            // Only run animation if reduced motion is off
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion) {
            document.getElementById("progressContainer").style.width = finalwidth;
            document.getElementById("progressBar").style.width = targetprogress + "%";
            animfinished = true;
            return;
            }
            if (!animationStart) animationStart = timestamp;
            const elapsed = timestamp - animationStart;
            const progress = Math.min(elapsed / containerDuration, 1);
            const easedProgress = easeOutCubic(progress);
            
            const width = easedProgress * parseFloat(finalwidth);
            document.getElementById("progressContainer").style.width = width + "vw";
            
            if (progress < 1) {
            requestAnimationFrame(animateContainerWidth);
            } else {
            document.getElementById("progressBar").style.width = targetprogress + "%";
            setTimeout(function() {
                animfinished = true;
            }, 1000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentSettings();
            setTimeout(function() {
                requestAnimationFrame(animateContainerWidth);
            }, 10);
        });
    </script>
</body>
</html>
