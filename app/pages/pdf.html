{% extends "templates/base.html" %}
{% block title %}Export to PDF{% endblock %}
{% block mainid %}pdfpage{% endblock %}
{% block head %}
    <style>
        label {
            display: block;
            margin: 0.25rem 0;
        }
    </style>
{% endblock %}
{% block content %}
    <h1>Export schedule</h1>
    <form action="" method="get" onsubmit="downloadPDF(event)">
        <div style="display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap;">
            <fieldset id="days" style="min-width:220px;border:1px solid #ddd;padding:0.5rem;">
                <legend>Days</legend>
                <label><input type="checkbox" name="monday" id="monday" checked> Monday</label>
                <label><input type="checkbox" name="tuesday" id="tuesday" checked> Tuesday</label>
                <label><input type="checkbox" name="wednesday" id="wednesday" checked> Wednesday</label>
                <label><input type="checkbox" name="thursday" id="thursday" checked> Thursday</label>
                <label><input type="checkbox" name="friday" id="friday" checked> Friday</label>
                <label><input type="checkbox" name="eb" id="eb" checked> Early release blue</label>
                <label><input type="checkbox" name="eg" id="eg" checked> Early release gold</label>
            </fieldset>

            <fieldset id="options" style="min-width:220px;border:1px solid #ddd;padding:0.5rem;">
                <legend>Options</legend>
                <label><input type="checkbox" name="noclass" id="noclass"> Hide Class Name</label>
                <label><input type="checkbox" name="noroom" id="noroom"> Hide Room Number</label>
                <label><input type="checkbox" name="notime" id="notime"> Hide Time</label>
                <label><input type="checkbox" name="nolunch" id="nolunch"> Hide Lunch</label>
                <label><input type="checkbox" name="smalltext" id="smalltext"> Small Text</label>
                <label><input type="checkbox" name="noperiod" id="noperiod"> Hide Period</label>
            </fieldset>
        </div>
        <button type="submit">Download PDF</button>
    </form>
{% endblock %}
{% block script %}
    <script>
        function downloadPDF(event) {
            event.preventDefault();
            const days = [];
            const daycheckboxes = document.getElementById('days').querySelectorAll('input[type="checkbox"]');
            for (const checkbox of daycheckboxes) {
                if (checkbox.checked) {
                    days.push(checkbox.name);
                }
            }
            const options = [];
            const optioncheckboxes = document.getElementById('options').querySelectorAll('input[type="checkbox"]');
            for (const checkbox of optioncheckboxes) {
                if (checkbox.checked) {
                    options.push(checkbox.name);
                }
            }
            const params = new URLSearchParams();
            for (const option of options) {
                params.append(option, 'true');
            }
            const url = `/classes/schedulepdf/${days.join(',')}?${params.toString()}`; 
            window.location.href = url;
        }
    </script>
{% endblock %}
